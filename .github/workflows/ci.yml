name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as Neon (design §7) and docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: paulitakes
          POSTGRES_PASSWORD: paulitakes
          POSTGRES_DB: paulitakes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paulitakes -d paulitakes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://paulitakes:paulitakes@localhost:5432/paulitakes
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-deployed-env
      BETTER_AUTH_URL: http://localhost:3000
      # Sign-in is never exercised in CI; env validation just requires these.
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      DISCORD_CLIENT_ID: ci-dummy
      DISCORD_CLIENT_SECRET: ci-dummy
      # Without a salt seed the view beacon 503s — feature off, ADR-0025 —
      # and the analytics e2e beacon specs can never record a row. Any
      # >=16-char value works; this one is CI-only and never deployed.
      ANALYTICS_SALT_SEED: ci-only-analytics-salt-seed
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Validates the committed migrations apply cleanly to a fresh database —
      # must run before `pnpm test`, whose globalSetup would otherwise migrate
      # the service DB first and turn this check into a no-op.
      - run: pnpm db:migrate

      - run: pnpm test

      # Catches production-compile-only failures (prerender errors, invalid
      # route exports) that lint/typecheck/dev-mode e2e can't see.
      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Capture light-mode audit
        if: contains(github.event.pull_request.labels.*.name, 'light-mode-audit')
        env:
          DATABASE_URL: postgres://paulitakes:paulitakes@localhost:5432/paulitakes_light_audit
          PGPASSWORD: paulitakes
          LIGHT_CAPTURE: "1"
        run: |
          createdb -h localhost -p 5432 -U paulitakes paulitakes_light_audit
          pnpm db:migrate
          pnpm test:e2e e2e/capture-light.spec.ts --project chromium --no-deps

      - name: Upload review screenshots
        if: success() && contains(github.event.pull_request.labels.*.name, 'light-mode-audit')
        uses: actions/upload-artifact@v4
        with:
          name: light-mode-audit-pr-${{ github.event.pull_request.number }}
          path: test-results/review-screenshots/light-mode/
          if-no-files-found: error
          retention-days: 7
